<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Correct Score — Калькулятор</title>
<style>
:root {
  --bg: #061426;
  --panel: #0b1e35;
  --line: #1e3d5d;
  --ink: #edf4ff;
  --muted: #91a6c4;
  --green: #32d583;
  --red: #ff6474;
  --blue: #1688ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { padding: 12px; max-width: 1000px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 5px; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 15px; }
.top-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 15px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--muted); }
input, button, textarea { font: inherit; }
input {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  background: #07182b;
  color: var(--ink);
  width: 100%;
}
input:focus, textarea:focus { outline: 2px solid var(--blue); }
.btn {
  border: 1px solid var(--line);
  background: #102b49;
  color: var(--ink);
  border-radius: 6px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
  display: inline-block;
  text-align: center;
}
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.danger { color: var(--red); border-color: #4a212d; }
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.tools .btn { flex: 1 1 40%; font-size: 13px; }

/* Блок сводки изменений */
.summary-box {
  background: linear-gradient(145deg, #102b49, #0a1c31);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 15px;
  display: none;
}
.summary-box h3 { font-size: 14px; margin: 0 0 10px; color: #8fc5ff; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
.summary-item { background: #0d2743; padding: 8px 4px; border-radius: 6px; text-align: center; border: 1px solid var(--line); }
.summary-item .score { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

/* Таблица */
.table-container {
  background: #081a2e;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 15px;
}
table {
  border-collapse: collapse;
  min-width: 1000px;
  table-layout: fixed;
  width: 100%;
}
th, td {
  border: 1px solid var(--line);
  text-align: center;
}
thead th {
  background: #123456;
  padding: 8px 4px;
  font-size: 12px;
  color: #d7e9ff;
  position: sticky;
  top: 0;
  z-index: 2;
}
th.score-col { width: 70px; }

/* Прилипающая колонка времени */
th.time-header, td.time-cell {
  width: 90px;
  position: sticky;
  left: 0;
  z-index: 3;
  background: #0d2743;
}
th.time-header { z-index: 4; background: #123456; }
td.time-cell {
  font-size: 11px;
  color: var(--muted);
  vertical-align: top;
  padding: 8px 4px;
}
.time-input {
  width: 100%;
  text-align: center;
  border: none;
  background: transparent;
  padding: 4px 0;
  font-size: 11px;
  color: var(--ink);
}

/* Ячейка с коэффициентом */
td.odds-cell {
  padding: 4px 2px;
  vertical-align: middle;
  background: #091b2f;
}
.cell-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 40px;
}
.odds-input {
  width: 100%;
  text-align: center;
  padding: 4px 0;
  border: 1px solid transparent;
  border-radius: 4px;
  font-size: 14px;
  font-weight: bold;
  background: transparent;
  color: var(--ink);
}
.odds-input:focus { background: var(--panel); border-color: var(--blue); }
.odds-input.down { color: var(--red); }
.odds-input.up { color: var(--green); }
.delta-label {
  font-size: 10px;
  font-weight: bold;
  margin-top: 2px;
  height: 12px;
  line-height: 12px;
}
.delta-label.down { color: var(--red); }
.delta-label.up { color: var(--green); }
.delta-label.same { opacity: 0; } /* скрываем нулевые изменения */

.empty-msg { padding: 30px; text-align: center; color: var(--muted); }
details { margin-bottom: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
summary { font-weight: bold; color: var(--blue); cursor: pointer; font-size: 14px; }
.details-content { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Correct Score</h1>
  <p class="sub">Калькулятор движения коэффициентов</p>

  <div class="top-panel">
    <div class="field">
      <label>Матч</label>
      <input id="matchName" placeholder="Например, Venezia — Bologna">
    </div>
    <div class="field">
      <label>Дата</label>
      <input id="matchDate" type="date">
    </div>
  </div>

  <div class="tools">
    <button class="btn primary" id="addUpdate">+ Добавить обновление</button>
    <button class="btn danger" id="clearAll">Очистить всё</button>
  </div>

  <div class="summary-box" id="summaryBox">
    <h3>Изменения за последнее обновление</h3>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div class="table-container" id="tableContainer">
    <div class="empty-msg">Нажми «Добавить обновление», чтобы начать.</div>
  </div>

  <details>
    <summary>Импорт (PDF / Ссылка) / Экспорт</summary>
    <div class="details-content">
      <div class="tools" style="margin-top:10px;">
        <button class="btn" id="exportCsv">Скачать CSV</button>
        <button class="btn" id="loadSample">Загрузить пример</button>
      </div>
      
      <div style="margin-top: 15px; border-top: 1px solid var(--line); padding-top: 15px;">
        <label style="font-size:12px; color:var(--muted);">Ссылка на NowGoal:</label>
        <input id="matchUrl" type="url" placeholder="https://..." style="margin: 5px 0;">
        <div class="tools">
          <button class="btn" id="importUrl">Импортировать</button>
          <button class="btn" id="openUrl">Открыть сайт</button>
        </div>
        <div class="field" id="pasteWrap" style="display:none; margin-top:10px;">
          <label>Если не сработало — вставь HTML-код страницы сюда:</label>
          <textarea id="pasteHtml" rows="3"></textarea>
          <button class="btn" id="importPaste" style="margin-top:5px;">Разобрать HTML</button>
        </div>
        <div class="sub" id="importStatus" style="margin-top:10px;"></div>
      </div>
    </div>
  </details>
</main>

<script>
// Группы счетов
const groups = [
  { name: '1', scores: ['1:0','2:0','2:1','3:0','3:1','3:2','4:0','4:1','4:2','4:3'] },
  { name: 'X', scores: ['0:0','1:1','2:2','3:3','4:4','other'] },
  { name: '2', scores: ['0:1','0:2','1:2','0:3','1:3','2:3','0:4','1:4','2:4','3:4'] }
];
const allScores = groups.flatMap(g => g.scores);
let updates = [];
let idSeq = 1;

const $ = s => document.querySelector(s);

// Форматирование
function val(x) {
  if (x === undefined || x === null || String(x).trim() === '') return null;
  let n = Number(String(x).replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? n : null;
}
function fmtPct(n) {
  if (n === null) return '';
  return (n > 0 ? '+' : '') + n.toFixed(1) + '%';
}
function getStamp() {
  let d = new Date();
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + 
         d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

// Расчет изменения
function calcChange(curInput, prevInput, score) {
  let cur = val(curInput);
  let prev = prevInput ? val(prevInput[score]) : null;
  if (cur === null || prev === null) return { cls: '', pct: '' };
  let p = ((cur - prev) / prev) * 100;
  if (Math.abs(p) < 0.01) return { cls: 'same', pct: '0%' };
  return {
    cls: p < 0 ? 'down' : 'up',
    pct: fmtPct(p)
  };
}

// Отрисовка
function render() {
  const box = $('#tableContainer');
  const sumBox = $('#summaryBox');
  const sumGrid = $('#summaryGrid');

  if (updates.length === 0) {
    box.innerHTML = '<div class="empty-msg">Нажми «Добавить обновление», чтобы начать.</div>';
    sumBox.style.display = 'none';
    return;
  }

  // --- Блок сводки изменений (для последнего обновления) ---
  if (updates.length > 1) {
    const curr = updates[updates.length - 1];
    const prev = updates[updates.length - 2];
    let htmlSum = '';
    let hasChanges = false;

    allScores.forEach(s => {
      let ch = calcChange(curr.odds[s], prev.odds, s);
      if (ch.cls === 'up' || ch.cls === 'down') {
        hasChanges = true;
        htmlSum += `<div class="summary-item">
          <div class="score">${s}</div>
          <div class="delta-label ${ch.cls}" style="opacity:1;">${ch.pct}</div>
        </div>`;
      }
    });

    if (hasChanges) {
      sumGrid.innerHTML = htmlSum;
      sumBox.style.display = 'block';
    } else {
      sumBox.style.display = 'none';
    }
  } else {
    sumBox.style.display = 'none';
  }

  // --- Таблица ---
  let html = '<table><thead><tr><th class="time-header">Time</th>';
  // Заголовки (верхняя группа)
  groups[0].scores.forEach(s => { html += `<th class="score-col">${s}</th>`; });
  html += '</tr></thead><tbody>';

  // Идем с конца (новые сверху)
  for (let i = updates.length - 1; i >= 0; i--) {
    const u = updates[i];
    const prevU = i > 0 ? updates[i - 1] : null;

    // Строка с временем и рынком 1
    html += `<tr><td class="time-cell" rowspan="3">
      <input class="time-input" data-time="${u.id}" value="${u.time}">
      <button class="btn danger" data-remove="${u.id}" style="padding:2px 6px; font-size:10px; margin-top:5px;">Удалить</button>
    </td>`;

    groups.forEach((g, gi) => {
      if (gi > 0) {
        // Для рынков X и 2 добавляем новую строку (время уже занято rowspan)
        html += '<tr>';
      }
      
      g.scores.forEach(s => {
        let curVal = u.odds[s] ?? '';
        let ch = calcChange(curVal, prevU ? prevU.odds : null, s);
        
        // Если рынок X (там 6 счетов), а таблица рассчитана на 10 (как в 1 и 2), 
        // добавляем пустые ячейки для выравнивания
        if (g.scores.length < 10) {
           // Этот момент пропускаем, так как структура групп задана жестко
        }

        html += `<td class="odds-cell">
          <div class="cell-wrap">
            <input class="odds-input ${ch.cls}" inputmode="decimal" data-odds="${u.id}|${s}" value="${curVal}" placeholder="—">
            <span class="delta-label ${ch.cls}">${ch.pct || '0'}</span>
          </div>
        </td>`;
      });

      // Добиваем пустыми ячейками, если в группе меньше 10 счетов (для X)
      if (g.scores.length < 10) {
        const emptyCells = 10 - g.scores.length;
        for (let k = 0; k < emptyCells; k++) {
           html += '<td class="odds-cell" style="background:transparent;"></td>';
        }
      }

      html += '</tr>';
    });
  }
  html += '</tbody></table>';
  box.innerHTML = html;
}

// Обработчики
$('#addUpdate').addEventListener('click', () => {
  const last = updates[updates.length - 1];
  const newOdds = {};
  // Автоматически копируем прошлые значения, если есть (удобно)
  if (last) {
    allScores.forEach(s => newOdds[s] = last.odds[s] || '');
  }
  updates.push({ id: idSeq++, time: getStamp(), odds: newOdds });
  save();
  render();
  // Прокрутка вправо (к первому коэффициенту)
  setTimeout(() => { $('.table-container').scrollLeft = 100; }, 10);
});

$('#clearAll').addEventListener('click', () => {
  if (confirm('Удалить все данные?')) {
    updates = [];
    idSeq = 1;
    save();
    render();
  }
});

// Сохранение и загрузка
function save() {
  try {
    localStorage.setItem('cs_calc_v2', JSON.stringify({ updates, idSeq, matchName: $('#matchName').value, matchDate: $('#matchDate').value }));
  } catch (e) {}
}
function load() {
  try {
    let d = JSON.parse(localStorage.getItem('cs_calc_v2'));
    if (d) {
      updates = d.updates || [];
      idSeq = d.idSeq || 1;
      $('#matchName').value = d.matchName || '';
      $('#matchDate').value = d.matchDate || '';
    }
  } catch (e) {}
  render();
}

$('#matchName').addEventListener('input', save);
$('#matchDate').addEventListener('input', save);

// Делегирование событий для таблицы
$('#tableContainer').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.odds) {
    let [id, s] = t.dataset.odds.split('|');
    let u = updates.find(x => x.id === +id);
    if (u) {
      u.odds[s] = t.value;
      save();
      render(); // Перерисовываем, чтобы обновить проценты
    }
  }
  if (t.dataset.time) {
    let u = updates.find(x => x.id === +t.dataset.time);
    if (u) {
      u.time = t.value;
      save();
    }
  }
});

$('#tableContainer').addEventListener('click', (e) => {
  if (e.target.dataset.remove) {
    updates = updates.filter(x => x.id !== +e.target.dataset.remove);
    save();
    render();
  }
});

// CSV
$('#exportCsv').addEventListener('click', () => {
  let rows = [['Время', ...allScores]];
  updates.forEach(u => rows.push([u.time, ...allScores.map(s => u.odds[s] ?? '')]));
  let csv = '\ufeff' + rows.map(r => r.map(x => '"' + String(x).replaceAll('"', '""') + '"').join(';')).join('\n');
  let a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'correct_score.csv';
  a.click();
});

// Пример
$('#loadSample').addEventListener('click', () => {
  updates = [];
  let samples = [
    ['01-01 12:00', [11,19,13,50,210,30,45,35,50,100,11,5.9,13,55,210,0,6.9,9.5,7.5,19,14.5,22,45,35,50,100]],
    ['01-01 14:30', [9.5,20,13,50,190,30,170,100,95,120,9.5,5.8,13,50,190,0,6,9,7.5,20,15,25,55,40,55,100]],
    ['01-01 17:00', [7.3,15.5,10,45,28,35,140,90,95,140,7.1,5.2,13.5,60,220,0,6.1,11.5,8.4,30,20,28,90,60,70,120]]
  ];
  samples.forEach(([time, vals]) => {
    let o = {};
    allScores.forEach((s, i) => o[s] = String(vals[i]));
    updates.push({ id: idSeq++, time, odds: o });
  });
  save();
  render();
});

// Парсинг ссылки
$('#openUrl').addEventListener('click', () => {
  let url = $('#matchUrl').value.trim();
  if (url) window.open(url, '_blank');
});

$('#importUrl').addEventListener('click', async () => {
  let url = $('#matchUrl').value.trim();
  if (!url) return;
  $('#importStatus').textContent = 'Загрузка...';
  try {
    let r = await fetch(url);
    let text = await r.text();
    parseAndLoadHtml(text);
  } catch (e) {
    $('#pasteWrap').style.display = 'block';
    $('#importStatus').textContent = 'Ошибка доступа (CORS). Скопируй HTML страницы и вставь ниже.';
  }
});

$('#importPaste').addEventListener('click', () => {
  parseAndLoadHtml($('#pasteHtml').value);
});

function parseAndLoadHtml(html) {
  let doc = new DOMParser().parseFromString(html, 'text/html');
  let found = {};
  doc.querySelectorAll('tr').forEach(tr => {
    let cells = [...tr.querySelectorAll('td, th')];
    for (let i = 0; i < cells.length; i++) {
      let text = cells[i].textContent.trim().replace(/\s+/g, '');
      if (allScores.includes(text)) {
        // Ищем первое подходящее число после счета
        for (let j = i + 1; j < cells.length; j++) {
          let numStr = cells[j].textContent.trim().replace(',', '.');
          if (/^\d+(\.\d+)?$/.test(numStr)) {
            let n = Number(numStr);
            if (n > 1 && n < 1000) {
              found[text] = numStr;
              break;
            }
          }
        }
      }
    }
  });
  if (Object.keys(found).length > 0) {
    updates.push({ id: idSeq++, time: getStamp(), odds: found });
    save();
    render();
    $('#importStatus').textContent = `Импортировано: ${Object.keys(found).length} коэф.`;
    $('#pasteWrap').style.display = 'none';
  } else {
    $('#importStatus').textContent = 'Коэффициенты не найдены в коде.';
  }
}

// Запуск
load();
</script>
</body>
</html>
